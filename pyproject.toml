[project]
name = "promptwall"
version = "0.1.0"
description = "Promptwall: LLM runtime security gateway (prompt injection, data leaks, tool-call policy)."
requires-python = ">=3.11"
dependencies = ["pyyaml>=6", "fastapi>=0.110", "uvicorn>=0.29", "pydantic>=2.5"]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27"]
llm = ["anthropic>=0.40"]

[project.scripts]
promptwall = "promptwall.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["promptwall*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
